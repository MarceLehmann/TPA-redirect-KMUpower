<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Weiterleitung zu KMUpower</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function () {
  var rules = [["/post", "https://kmupower.com/newsletter-archiv"], ["/blog", "https://kmupower.com/newsletter-archiv"], ["/service-page", "https://kmupower.com/loesungen"], ["/booking-calendar", "https://kmupower.com/kontakt"], ["/portfolio", "https://kmupower.com/case-studies"]];
  var fallback = "https://kmupower.com/";
  var path = "";
  try { path = decodeURIComponent(location.pathname).toLowerCase().replace(/\/+$/, ""); } catch (e) { path = location.pathname.toLowerCase(); }
  var target = fallback;
  for (var i = 0; i < rules.length; i++) {
    var p = rules[i][0];
    if (path === p || path.indexOf(p + "/") === 0) { target = rules[i][1]; break; }
  }
  document.getElementById("go").href = target;
  window.location.replace(target);
})();
</script>
</head>
<body>
<p>Diese Seite ist umgezogen. <a id="go" href="https://kmupower.com/">Weiter zu KMUpower</a></p>
</body>
</html>
